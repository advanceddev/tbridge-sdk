<!doctype html>
<html><head><meta charset="utf-8"><title>tbridge overlay repro</title>
<!--
  Browser check for ton-connect/sdk#185 (host <dialog>) and #568 (body pointer-events:none).
  pnpm build && python -m http.server 8765   (from repo root), then open
  http://127.0.0.1:8765/tests/browser/overlay.html?case=plain|dialog|radix|cleanup|escape
  Expect: hitIsOurItem true (plain, dialog, radix); topLeft 0 and hostClickable true (cleanup, escape).
  Headless: chrome --headless=new --virtual-time-budget=5000 --dump-dom <url>
-->
<style>body{font:14px system-ui;margin:24px} dialog{padding:24px}</style></head>
<body>
<h3 id="case">case: (none)</h3>
<p id="out"></p>
<dialog id="hostdlg"><p>Host native &lt;dialog&gt; (showModal)</p></dialog>
<script type="module">
import { openWalletModal } from '../../dist/tbridge.js';
const wallets = [{ app_name: 'w', name: 'Wallet', image: '', about_url: '',
  bridge: [{ type: 'sse', url: 'https://b.test' }], platforms: ['ios'], features: [] }];
window.__selected = 0;
const open = () => openWalletModal({ wallets, onSelect: () => { window.__selected++; } });
window.probe = () => {
  const item = document.querySelector('.tbridge-item');
  if (!item) return { item: false };
  const r = item.getBoundingClientRect();
  const x = Math.round(r.left + r.width / 2), y = Math.round(r.top + r.height / 2);
  const hit = document.elementFromPoint(x, y);
  return { x, y, hitIsOurItem: !!hit?.closest?.('.tbridge-item'),
           hit: hit ? (hit.id || String(hit.className) || hit.tagName) : null,
           selected: window.__selected };
};
const c = new URLSearchParams(location.search).get('case');
document.getElementById('case').textContent = 'case: ' + c;
if (c === 'plain')  { open(); }                                                  // control
if (c === 'dialog') { document.getElementById('hostdlg').showModal(); open(); }   // #185
if (c === 'radix')  { document.body.style.pointerEvents = 'none'; open(); }       // #568
if (c === 'cleanup' || c === 'escape') {
  const h = open();
  if (c === 'cleanup') h.close();
  else document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  const hit = document.elementFromPoint(30, 30);
  document.getElementById('out').textContent = JSON.stringify({
    topLeft: document.querySelectorAll('dialog.tbridge-top').length,
    hostClickable: hit?.id === 'case' || hit?.tagName === 'BODY' || hit?.tagName === 'HTML',
    hit: hit ? (hit.id || hit.tagName) : null });
} else
document.getElementById('out').textContent = JSON.stringify(window.probe());
</script></body></html>
