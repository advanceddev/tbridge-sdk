name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_AUTH_TOKEN: ''
      NPM_TOKEN: ''

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      - name: Force clean environment & Verify OIDC
        run: |
          # Физически удаляем переменные из окружения bash на всякий случай
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN

          echo "Проверка переменных окружения (должны быть пустыми):"
          echo "NODE_AUTH_TOKEN='${NODE_AUTH_TOKEN}'"
          echo "NPM_TOKEN='${NPM_TOKEN}'"

          echo "Проверка аутентификации npm..."
          # Если OIDC работает, здесь будет напечатано: github-actions
          pnpm whoami

      - name: Publish to npm
        run: pnpm publish --access public --provenance --no-git-checks
