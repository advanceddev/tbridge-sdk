name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      - name: Verify OIDC Authentication
        run: |
          echo "Checking npm auth status..."
          npm whoami
          # Если всё настроено верно, здесь ДОЛЖНО быть напечатано: github-actions

      - name: Publish to npm
        run: npm publish --access public --provenance --no-git-checks
