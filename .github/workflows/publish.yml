name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      - name: Force OIDC Auth
        run: |
          npm config delete //registry.npmjs.org/:_authToken
          npm config delete _authToken
          npm config list
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''

      - name: Debug OIDC Auth
        run: npm whoami

      - name: Publish to npm
        run: npm publish --access public --provenance --no-git-checks
